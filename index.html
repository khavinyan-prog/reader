<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#12110e">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="קורא">
  <meta name="format-detection" content="telephone=no">
  <title>קורא</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="vendor/fonts/literata-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-theme="night" data-screen="library">

  <main id="library" class="screen">
    <header class="lib-head">
      <svg class="lib-mark" viewBox="0 0 64 64" aria-hidden="true"><use href="#mark"/></svg>
      <h1>קורא</h1>
      <p class="tag">ספרים באנגלית בקול, והעיניים עוקבות אחרי המילים.</p>
    </header>

    <section class="opener">
      <button id="openBtn" class="open-btn" type="button">
        <span class="plus" aria-hidden="true">+</span>
        <span>פתיחת ספר PDF</span>
      </button>
      <p class="drop-hint">אפשר גם לגרור קובץ לכאן</p>
      <input id="file" type="file" accept="application/pdf,.pdf" hidden>
    </section>

    <section id="shelf" class="shelf" hidden>
      <h2>הספרים שלי</h2>
      <ul id="books"></ul>
    </section>

    <ol id="emptyNote" class="how">
      <li><b>בוחרים</b> קובץ PDF של ספר באנגלית</li>
      <li><b>נוגעים</b> במשפט שממנו רוצים להתחיל</li>
      <li><b>מקשיבים</b> והעיניים רצות עם ההדגשה</li>
    </ol>

    <p class="privacy">הספרים נשמרים רק במכשיר הזה. שום קובץ לא עולה לאינטרנט.</p>
  </main>

  <main id="reader" class="screen" hidden>
    <header class="topbar">
      <button id="backBtn" class="icon-btn" type="button" aria-label="חזרה לספרייה">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="tt">
        <div id="bookTitle" class="book-name" dir="auto"></div>
        <button id="pageInfo" class="page-info" type="button"></button>
      </div>
      <button id="menuBtn" class="icon-btn" type="button" aria-label="תפריט">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
      </button>
    </header>

    <div id="notice" class="notice" hidden></div>
    <article id="text" class="text" lang="en" dir="ltr"></article>
    <div class="end-space" aria-hidden="true"></div>

    <button id="follow" class="follow" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>חזרה למקום ההקראה</span>
    </button>

    <nav class="dock" aria-label="שליטה בהקראה">
      <div class="dock-in" dir="ltr">
        <button id="back10" class="ctl" type="button" aria-label="אחורה 10 משפטים">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="15.2" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" font-family="Rubik, sans-serif">10</text></svg>
        </button>
        <button id="prev" class="ctl" type="button" aria-label="המשפט הקודם">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 6.2v11.6a.8.8 0 0 1-1.25.66L9.4 12.66a.8.8 0 0 1 0-1.32l7.35-5.8A.8.8 0 0 1 18 6.2z" fill="currentColor"/></svg>
        </button>
        <button id="play" class="ctl play" type="button" aria-label="הקראה"></button>
        <button id="next" class="ctl" type="button" aria-label="המשפט הבא">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 6.2v11.6a.8.8 0 0 0 1.25.66l7.35-5.8a.8.8 0 0 0 0-1.32L7.25 5.54A.8.8 0 0 0 6 6.2z" fill="currentColor"/></svg>
        </button>
        <button id="speedBtn" class="ctl speed" type="button" aria-label="מהירות">1×</button>
      </div>
      <button id="voiceBtn" class="voice-chip" type="button" aria-label="בחירת קול">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="voiceName">קול</span>
      </button>
    </nav>
  </main>

  <div id="sheet" class="sheet-wrap" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <span class="grip" aria-hidden="true"></span>
        <h3 id="sheetTitle"></h3>
        <button class="sheet-close icon-btn" type="button" aria-label="סגירה">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <div id="busy" class="busy" hidden>
    <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <p id="busyMsg"></p>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div class="drop-veil" aria-hidden="true"><span>לשחרר כאן את הקובץ</span></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 64 64">
      <path d="M32 18c-5-4-12-5.5-20-5v33c8-.5 15 1 20 5 5-4 12-5.5 20-5V13c-8-.5-15 1-20 5z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <path d="M32 18v33" stroke="currentColor" stroke-width="3"/>
      <path d="M40 27v8M45 24v14M50 29v4" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
    </symbol>
  </svg>

  <script type="module" src="js/app.js"></script>
</body>
</html>
